name: Apply word-boundary source fix

on:
  push:
    branches:
      - upgrade/teacher-controls-e2e

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/teacher-controls-e2e

      - name: Apply source repair
        run: node scripts/fix-word-boundaries.mjs

      - name: Commit repaired validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameController.js src/chapterOneCombat.js
          if git diff --cached --quiet; then
            echo "No repair required."
            exit 0
          fi
          git commit -m "Fix whole-word matching in writing validation"
          git push origin HEAD:upgrade/teacher-controls-e2e
